<p-dialog [(visible)]="visible" [header]="editMode ? 'تعديل القسم' : 'إضافة قسم جديد'" [modal]="true"
    [style]="{width:'400px'}" [dir]="'rtl'" [draggable]="false" [resizable]="false"
    (onHide)="cancel()" styleClass="dept-dialog">
    <div class="p-fluid">
        <label class="dialog-label">اسم القسم <span class="text-danger">*</span></label>
        <input pInputText type="text" [(ngModel)]="model.name"
            placeholder="مثال: قسم المحاسبة" (keyup.enter)="save()" />
    </div>
    <ng-template pTemplate="footer">
        <p-button label="إلغاء" icon="pi pi-times" [text]="true" (onClick)="cancel()"></p-button>
        <p-button [label]="editMode ? 'حفظ' : 'إضافة'" icon="pi pi-check" size="small"
            severity="primary" [loading]="saving()" (onClick)="save()"></p-button>
    </ng-template>
</p-dialog>
<p-toast></p-toast>
