<div class="roles-container">
  <!-- Toolbar -->
  <div class="flex justify-content-between align-items-center mb-2">
    <h5 class="m-0 text-sm font-bold text-primary">إدارة الأدوار</h5>
    <button pButton pRipple icon="pi pi-plus" label="إضافة" class="p-button-sm p-button-success py-1 px-2 text-xs"
      (click)="openNew()" *appHasPermission="'roles.create'"></button>
  </div>

  <!-- Table -->
  <p-table [value]="roles" [loading]="loading" styleClass="p-datatable-sm p-datatable-gridlines compact-table"
    [rowHover]="true" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 3rem">#</th>
        <th>الاسم (EN)</th>
        <th>الاسم (AR)</th>
        <th>الوصف</th>
        <th style="width: 5rem">اللون</th>
        <th style="width: 5rem">الحالة</th>
        <th style="width: 5rem">النظام</th>
        <th style="width: 10rem">الإجراءات</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-role let-i="rowIndex">
      <tr>
        <td class="text-center">{{i + 1}}</td>
        <td>{{role.name}}</td>
        <td>{{role.nameAr}}</td>
        <td>{{role.description}}</td>
        <td class="text-center">
          <span class="color-badge" [style.backgroundColor]="getValidColor(role.color)"></span>
        </td>
        <td class="text-center">
          <i class="pi"
            [ngClass]="{'pi-check-circle text-green-500': role.isActive, 'pi-times-circle text-red-500': !role.isActive}"></i>
        </td>
        <td class="text-center">
          <i *ngIf="role.isSystemRole" class="pi pi-lock text-orange-500" pTooltip="دور أساسي بالنظام"></i>
        </td>
        <td class="text-center">
          <div class="flex justify-content-center gap-1">
            <button pButton pRipple icon="pi pi-shield"
              class="p-button-rounded p-button-info p-button-text p-button-sm action-btn" pTooltip="الصلاحيات"
              (click)="openPermissions(role)" *appHasPermission="'roles.manage_permissions'"></button>
            <button pButton pRipple icon="pi pi-pencil"
              class="p-button-rounded p-button-success p-button-text p-button-sm action-btn" pTooltip="تعديل"
              (click)="openEdit(role)" [disabled]="role.isSystemRole" *appHasPermission="'roles.edit'"></button>
            <button pButton pRipple icon="pi pi-trash"
              class="p-button-rounded p-button-danger p-button-text p-button-sm action-btn" pTooltip="حذف"
              (click)="delete(role)" [disabled]="role.isSystemRole" *appHasPermission="'roles.delete'"></button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="8" class="text-center p-2 text-xs">لا يوجد بيانات</td>
      </tr>
    </ng-template>
  </p-table>

  <!-- Edit/Create Dialog -->
  <p-dialog [(visible)]="displayDialog" [style]="{width: '350px'}" [header]="isEdit ? 'تعديل الدور' : 'دور جديد'"
    [modal]="true" class="compact-dialog">
    <form [formGroup]="roleForm" class="flex flex-column gap-2 mt-2">

      <div class="field">
        <label for="name" class="text-xs mb-1 block">الاسم الإنجليزي</label>
        <input type="text" pInputText id="name" formControlName="name" class="p-inputtext-sm w-full" autofocus />
      </div>

      <div class="field">
        <label for="nameAr" class="text-xs mb-1 block">الاسم العربي</label>
        <input type="text" pInputText id="nameAr" formControlName="nameAr" class="p-inputtext-sm w-full" />
      </div>

      <div class="field">
        <label for="description" class="text-xs mb-1 block">الوصف</label>
        <input type="text" pInputText id="description" formControlName="description" class="p-inputtext-sm w-full" />
      </div>

      <div class="flex justify-content-between align-items-center">
        <div class="flex align-items-center gap-2">
          <label for="color" class="text-xs m-0">اللون</label>
          <p-colorPicker formControlName="color" appendTo="body"></p-colorPicker>
        </div>
        <div class="flex align-items-center gap-2">
          <label for="isActive" class="text-xs m-0">فعال</label>
          <p-inputSwitch formControlName="isActive"></p-inputSwitch>
        </div>
      </div>
    </form>

    <ng-template pTemplate="footer">
      <button pButton label="إلغاء" icon="pi pi-times" class="p-button-text p-button-sm py-1 px-2 text-xs"
        (click)="displayDialog=false"></button>
      <button pButton label="حفظ" icon="pi pi-check" class="p-button-primary p-button-sm py-1 px-2 text-xs"
        (click)="save()"></button>
    </ng-template>
  </p-dialog>

  <!-- Permissions Dialog -->
  <p-dialog [(visible)]="displayPermissionsDialog" [style]="{width: '90vw', maxWidth: '1400px'}" [maximizable]="true"
    [header]="'إدارة صلاحيات الدور: ' + (selectedRoleForPermissions?.nameAr || selectedRoleForPermissions?.name || '')"
    [modal]="true" class="permissions-dialog">

    <div class="grid pt-3">
      <div class="col-12 md:col-6 lg:col-4 xl:col-3 mb-3" *ngFor="let group of permissionGroups">
        <div class="surface-card shadow-1 border-round-xl h-full flex flex-column overflow-hidden">
          
          <!-- Colored Header -->
          <div class="flex align-items-center gap-2 py-2 px-3 shadow-1" [ngClass]="getThemeForModule(group.module).header">
            <i class="pi text-white text-lg" [ngClass]="getThemeForModule(group.module).icon"></i>
            <span class="text-sm font-bold text-white m-0">{{group.moduleAr || group.module}}</span>
          </div>

          <!-- Body -->
          <div class="flex flex-column flex-1 p-3">
            
            <!-- Select All -->
            <div class="flex align-items-center border-round p-2 mb-3 border-1 surface-border hover-bg-gray transition-colors cursor-pointer" 
                 [ngClass]="getThemeForModule(group.module).bg"
                 (click)="toggleGroup(group, !isGroupSelected(group))">
              <p-checkbox [binary]="true" [ngModel]="isGroupSelected(group)" (onChange)="toggleGroup(group, $event.checked)" [inputId]="'group_' + group.module"></p-checkbox>
              <label [for]="'group_' + group.module" class="ml-2 mr-2 cursor-pointer text-xs font-bold text-900" style="flex: 1;">
                تحديد كافة الصلاحيات
              </label>
            </div>
            
            <!-- Permissions List -->
            <div class="flex flex-column gap-2 overflow-y-auto pr-2 custom-scrollbar" style="max-height: 240px;">
              <div *ngFor="let perm of group.permissions" class="flex align-items-start hover-bg-gray p-1 border-round transition-colors transition-duration-200">
                <p-checkbox name="permissions" [value]="perm.id" [(ngModel)]="selectedPermissionIds" [inputId]="'perm_' + perm.id" class="mt-1"></p-checkbox>
                <label [for]="'perm_' + perm.id" class="ml-2 mr-2 cursor-pointer text-xs text-700 line-height-2" style="flex: 1;">
                  {{perm.actionAr || perm.action}}
                </label>
              </div>
            </div>
            
          </div>
        </div>
      </div>
    </div>

    <ng-template pTemplate="footer">
      <div class="flex justify-content-end gap-2 mt-3 border-top-1 surface-border pt-3">
        <button pButton label="إلغاء التعديلات" icon="pi pi-times" class="p-button-outlined p-button-secondary"
          (click)="displayPermissionsDialog=false"></button>
        <button pButton label="حفظ الصلاحيات المحددة" icon="pi pi-check-circle" class="p-button-primary"
          (click)="savePermissions()"></button>
      </div>
    </ng-template>
  </p-dialog>

  <p-toast></p-toast>
  <p-confirmDialog [style]="{width: '350px'}" acceptButtonStyleClass="p-button-danger p-button-sm py-1 px-2 text-xs"
    rejectButtonStyleClass="p-button-text p-button-sm py-1 px-2 text-xs"></p-confirmDialog>
</div>
