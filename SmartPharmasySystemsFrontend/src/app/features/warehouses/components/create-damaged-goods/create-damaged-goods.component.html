<div class="dg-form-wrap animate-fade-in" dir="rtl">
    <!-- ===== Header ===== -->
    <div class="dg-header">
        <div class="dg-header-start">
            <button pButton icon="pi pi-arrow-right" class="dg-btn-secondary" (click)="backToList()"></button>
            <div class="dg-icon">
                <i class="pi pi-file-excel"></i>
            </div>
            <div>
                <h1 class="dg-title">تسجيل بضاعة تالفة</h1>
                <p class="dg-subtitle">طلب تسوية مخزنية وإهلاك أدوية</p>
            </div>
        </div>
        <div class="dg-header-end">
            <button pButton label="حفظ المستند" icon="pi pi-check" class="dg-btn-primary" [loading]="saving"
                (click)="saveRecord()"></button>
        </div>
    </div>

    <!-- ===== Form Panel ===== -->
    <div class="dg-form-panel mt-3">
        <div class="dg-section-title">
            <i class="pi pi-info-circle"></i>
            <span>بيانات الإهلاك والتلف</span>
        </div>
        
        <form [formGroup]="damagedForm">
            <div class="grid p-fluid">
                <div class="col-12 md:col-6 dg-field">
                    <label>المخزن الأصلي (مكان التلف)</label>
                    <p-dropdown [options]="warehouses" formControlName="sourceWarehouseId" optionLabel="name" optionValue="id"
                        placeholder="اختر المستودع..." [filter]="true" filterBy="name" appendTo="body"></p-dropdown>
                </div>
                
                <div class="col-12 md:col-6 dg-field">
                    <label>اختر الصنف المتضرر</label>
                    <p-dropdown [options]="availableMedicines" formControlName="selectedStockItem" 
                        placeholder="ابحث واختر الصنف والتشغيلة..." [filter]="true" filterBy="label"
                        [disabled]="!damagedForm.get('sourceWarehouseId')?.value" appendTo="body"></p-dropdown>
                </div>

                <div class="col-12 md:col-4" *ngIf="damagedForm.get('selectedStockItem')?.value">
                    <div class="dg-available-box h-full flex flex-column justify-content-center">
                        <span class="dg-available-lbl">الرصيد المتاح حالياً</span>
                        <span class="dg-available-val">{{ damagedForm.get('availableQuantity')?.value }}</span>
                    </div>
                </div>

                <div class="col-12 md:col-4 dg-field" *ngIf="damagedForm.get('selectedStockItem')?.value">
                    <label class="text-danger">كمية التالف (المراد إهلاكها)</label>
                    <p-inputNumber formControlName="quantity" [min]="1" 
                        [max]="damagedForm.get('availableQuantity')?.value || 1" 
                        class="text-center"></p-inputNumber>
                </div>

                <div class="col-12 md:col-4 dg-field">
                    <label>نوع التلف / سبب الإتلاف</label>
                    <p-dropdown [options]="damageTypes" formControlName="damageType" optionLabel="label" optionValue="value"
                        appendTo="body"></p-dropdown>
                </div>

                <div class="col-12 dg-field mt-2">
                    <label>تفاصيل أو شرح إضافي</label>
                    <input pInputText formControlName="reason" placeholder="اكتب تفاصيل إضافية عن سبب التلف..." />
                </div>
            </div>
        </form>
    </div>
</div>
