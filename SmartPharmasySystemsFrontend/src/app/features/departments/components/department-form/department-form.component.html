<p-dialog [(visible)]="visible" [header]="editMode ? 'تعديل القسم' : 'إضافة قسم جديد'" [modal]="true"
    [style]="{width:'450px'}" [dir]="'rtl'" [draggable]="false" [resizable]="false"
    (onHide)="cancel()" styleClass="dept-dialog">
    <div class="flex flex-column gap-3">
        <label class="form-label">اسم القسم <span class="text-danger">*</span></label>
        <input pInputText type="text" class="premium-input w-full" [(ngModel)]="model.name"
            placeholder="مثال: قسم المحاسبة" (keyup.enter)="save()" />
    </div>
    <ng-template pTemplate="footer">
        <div class="flex justify-content-end gap-2">
            <p-button label="إلغاء" icon="pi pi-times" [rounded]="true" severity="secondary" (onClick)="cancel()"></p-button>
            <p-button [label]="editMode ? 'حفظ' : 'إضافة'" icon="pi pi-check" [rounded]="true"
                severity="primary" [loading]="saving()" (onClick)="save()"></p-button>
        </div>
    </ng-template>
</p-dialog>
<p-toast></p-toast>
