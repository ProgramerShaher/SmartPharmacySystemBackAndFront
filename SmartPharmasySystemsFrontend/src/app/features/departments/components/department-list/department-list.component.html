<div class="report-container" dir="rtl">
  <!-- Header Section -->
  <div class="page-header">
    <div class="title-wrap">
      <div class="icon-circle" style="background: linear-gradient(135deg, #a855f7, #7c3aed);"><i class="pi pi-th-large"></i></div>
      <div>
        <h1>إدارة الأقسام</h1>
        <p>تصنيف وهيكلة موظفي الشركة حسب الأقسام الإدارية والتشغيلية</p>
      </div>
    </div>
    <div class="actions no-print">
      <p-button label="إضافة قسم جديد" icon="pi pi-plus" size="small" severity="primary" (onClick)="openAddDialog()"></p-button>
    </div>
  </div>

  <!-- Filters Section -->
  <section class="filters-panel no-print" style="grid-template-columns: 1fr;">
    <div class="filter-field">
      <label>بحث سريع</label>
      <input pInputText type="text" placeholder="بحث باسم القسم..." (input)="onSearch($any($event.target).value)" />
    </div>
  </section>

  <!-- Table -->
  <section class="table-panel">
    <p-table [value]="departments()" [paginator]="true" [rows]="10" [totalRecords]="totalRecords()"
             [loading]="loading()" [rowHover]="true" responsiveLayout="scroll"
             styleClass="p-datatable-sm compact-table">
      <ng-template pTemplate="header">
        <tr>
          <th style="width: 50px" class="text-center">#</th>
          <th>اسم القسم</th>
          <th style="width: 120px" class="text-center">عدد الموظفين</th>
          <th style="width: 90px" class="text-center no-print">الإجراءات</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-dept let-i="rowIndex">
        <tr>
          <td class="text-center"><span class="muted" style="display: inline;">{{i + 1}}</span></td>
          <td>
            <strong style="color: #0f172a;">{{ dept.name }}</strong>
          </td>
          <td class="text-center">
            <span class="type-pill type-blue">
              <i class="pi pi-users" style="margin-left: 0.25rem;"></i>{{ dept.employeeCount ?? 0 }}
            </span>
          </td>
          <td class="text-center no-print">
            <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="info" size="small"
                      (onClick)="openEditDialog(dept)" pTooltip="تعديل"></p-button>
            <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" size="small"
                      (onClick)="confirmDelete(dept.id, dept.name)" pTooltip="حذف"></p-button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4" class="text-center p-4">
            <div class="muted">
              <i class="pi pi-inbox" style="font-size: 2rem; color: #cbd5e1; display: block; margin-bottom: 0.5rem;"></i>
              <strong>لا توجد أقسام</strong>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </section>
</div>

<app-department-form *ngIf="showFormDialog()" [visible]="showFormDialog()" [department]="selectedDepartment"
    [editMode]="isEditMode" (saved)="onFormSaved()" (cancelled)="onFormCancelled()">
</app-department-form>

<p-confirmDialog acceptLabel="نعم" rejectLabel="إلغاء"></p-confirmDialog>
<p-toast></p-toast>
