<div class="report-container" dir="rtl">
  <!-- Header Section -->
  <div class="page-header">
    <div class="title-wrap">
      <div class="icon-circle"><i class="pi pi-sitemap"></i></div>
      <div>
        <h1>شجرة الحسابات</h1>
        <p>هيكل الحسابات الرئيسي والفرعي للنظام المالي</p>
      </div>
    </div>

    <div class="actions no-print">
      <p-button icon="pi pi-angle-double-down" label="توسيع الكل" size="small" [outlined]="true" severity="secondary" (onClick)="expandAll()"></p-button>
      <p-button icon="pi pi-angle-double-up" label="طي الكل" size="small" [outlined]="true" severity="secondary" (onClick)="collapseAll()"></p-button>
      <p-button icon="pi pi-plus" label="حساب رئيسي" size="small" severity="primary" (onClick)="showAddDialog()"></p-button>
      <p-button icon="pi pi-refresh" [rounded]="true" severity="primary" (onClick)="loadAccounts()" [loading]="loading"></p-button>
    </div>
  </div>

  <div class="table-panel">
    <p-tree [value]="accountsTree"
            [loading]="loading"
            selectionMode="single"
            styleClass="royal-tree"
            [filter]="true"
            filterPlaceholder="ابحث في شجرة الحسابات..."
            filterBy="label,data.code"
            filterMode="lenient">
      <ng-template let-node pTemplate="default">
        <div class="tree-node">
          <div class="node-main">
            <div class="node-info">
              <i [class]="node.expanded ? 'pi pi-folder-open' : (node.data.isMainAccount ? 'pi pi-folder' : 'pi pi-file')"
                 class="node-icon"
                 [class.icon-folder]="node.data.isMainAccount"
                 [class.icon-leaf]="!node.data.isMainAccount"></i>
              <div class="node-text">
                <span class="node-name">{{node.label}}</span>
                <span class="node-code">{{node.data.code}}</span>
              </div>
            </div>
            <div class="node-meta">
              <span class="type-badge"
                    [ngClass]="'type-' + (node.data.type ? node.data.type.toString().toLowerCase() : 'none')">
                {{getTypeNameArabic(node.data.type)}}
              </span>
              <span class="node-balance"
                    [ngClass]="node.data.currentBalance >= 0 ? 'positive' : 'negative'">
                {{node.data.currentBalance | number:'1.2-2'}}
              </span>
              <div class="node-actions no-print">
                <p-inputSwitch [(ngModel)]="node.data.isActive"
                               (onChange)="toggleAccountStatus(node.data)"
                               pTooltip="تفعيل/تعطيل"
                               tooltipPosition="top"></p-inputSwitch>
                <p-button icon="pi pi-plus-circle" [rounded]="true" [text]="true" severity="info" size="small"
                        pTooltip="إضافة حساب فرعي"
                        tooltipPosition="top"
                        (click)="showAddDialog(node.data)"
                        *ngIf="node.data.isMainAccount"></p-button>
                <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" size="small"
                        pTooltip="حذف"
                        tooltipPosition="top"
                        (click)="deleteAccount(node)"></p-button>
              </div>
            </div>
          </div>
        </div>
      </ng-template>
    </p-tree>

    <div *ngIf="!loading && accountsTree.length === 0" class="empty-state">
      <i class="pi pi-inbox"></i>
      <h4>لا توجد حسابات</h4>
      <p>ابدأ بإضافة حساب رئيسي جديد</p>
      <p-button label="إضافة حساب" icon="pi pi-plus" size="small" (onClick)="showAddDialog()"></p-button>
    </div>
  </div>
</div>

<p-dialog [(visible)]="displayAddDialog"
          header="إضافة حساب"
          [modal]="true"
          [style]="{width: '400px'}"
          styleClass="royal-dialog"
          [draggable]="false"
          [resizable]="false">
  <div class="p-fluid">
    <div class="field mb-3">
      <label class="dialog-label">كود الحساب</label>
      <div class="p-inputgroup">
        <span class="p-inputgroup-addon"><i class="pi pi-tag"></i></span>
        <input type="text" pInputText [(ngModel)]="newAccount.code" placeholder="أدخل الكود">
      </div>
    </div>
    <div class="field mb-3">
      <label class="dialog-label">اسم الحساب</label>
      <div class="p-inputgroup">
        <span class="p-inputgroup-addon"><i class="pi pi-info-circle"></i></span>
        <input type="text" pInputText [(ngModel)]="newAccount.name" placeholder="اسم الحساب">
      </div>
    </div>
    <div class="field mb-3" *ngIf="!newAccount.parentId">
      <label class="dialog-label">نوع الحساب</label>
      <p-dropdown [options]="accountTypeOptions"
                  [(ngModel)]="newAccount.accountType"
                  placeholder="اختر النوع"
                  appendTo="body"></p-dropdown>
    </div>
    <div class="field mb-2" *ngIf="newAccount.parentId">
      <div class="parent-banner">
        <i class="pi pi-share-alt"></i>
        <span>حساب فرعي تحت: <strong>رقم {{newAccount.parentId}}</strong></span>
      </div>
    </div>
  </div>
  <ng-template pTemplate="footer">
    <p-button label="إلغاء" icon="pi pi-times" [text]="true" (onClick)="displayAddDialog=false"></p-button>
    <p-button label="حفظ" icon="pi pi-check" size="small" (onClick)="saveAccount()"></p-button>
  </ng-template>
</p-dialog>

<p-toast position="bottom-left"></p-toast>
<p-confirmDialog></p-confirmDialog>
