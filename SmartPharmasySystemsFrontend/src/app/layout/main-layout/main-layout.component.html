<!-- main-layout.component.html -->
<div class="layout-wrapper" dir="rtl" [class.sidebar-collapsed]="isSidebarCollapsed" [class.layout-mobile-active]="!isSidebarCollapsed && isMobile">
    <!-- غطاء خلفي عند فتح القائمة الجانبية في الشاشات الصغيرة -->
    <div class="layout-mask" (click)="setSidebarCollapsed(true)"></div>

    <!-- Sidebar -->
    <app-sidebar class="layout-sidebar" [isCollapsed]="isSidebarCollapsed"
        (collapseChange)="setSidebarCollapsed($event)"></app-sidebar>

    <!-- Main Content Area -->
    <div class="layout-main-container">
        <!-- Fixed Topbar -->
        <app-topbar class="layout-topbar"></app-topbar>

        <!-- Scrollable Content -->
        <div class="layout-content-scrollable">
            <div class="content-wrapper">
                <!-- Page Content -->
                <div class="page-content">
                    <router-outlet></router-outlet>
                </div>
            </div>
        </div>

        <!-- Shift Modal -->
        <app-shift-modal [visible]="shiftModalVisible" [mode]="shiftModalMode"
            (shiftProcessed)="onShiftProcessed($event)">
        </app-shift-modal>

        <!-- Footer -->
        <div class="layout-footer bg-gray-900">
            <div class="footer-content">
                <span class="text-0 text-sm">© 2024 الصيدلية الذكية - نظام الإدارة الطبي</span>
                <div class="footer-links">
                    <a class="text-0 hover:text-primary text-sm no-underline mr-4">الشروط</a>
                    <a class="text-0 hover:text-primary text-sm no-underline">الخصوصية</a>
                </div>
            </div>
        </div>
    </div>
</div>
