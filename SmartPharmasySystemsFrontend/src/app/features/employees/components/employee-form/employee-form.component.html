<p-dialog [(visible)]="visible" [header]="editMode ? 'تعديل بيانات الموظف' : 'إضافة موظف جديد'" [modal]="true"
    [style]="{width:'580px'}" [dir]="'rtl'" [draggable]="false" [resizable]="false"
    (onHide)="cancel()" styleClass="employee-dialog">

    <div class="p-fluid" style="display: flex; flex-direction: column; gap: 0.5rem;">
        <div style="display: flex; gap: 0.5rem;">
            <div style="flex: 1;">
                <label class="dialog-label">كود الموظف <span class="text-danger">*</span></label>
                <input pInputText type="text" [class.ng-invalid]="hasError('employeeCode')" [(ngModel)]="model.employeeCode" placeholder="مثال: EMP001" />
                <small *ngIf="hasError('employeeCode')" class="text-danger" style="font-size: 0.55rem;">{{ errors['employeeCode'] }}</small>
            </div>
            <div style="flex: 1;">
                <label class="dialog-label">الاسم الكامل <span class="text-danger">*</span></label>
                <input pInputText type="text" [class.ng-invalid]="hasError('fullName')" [(ngModel)]="model.fullName" placeholder="الاسم الكامل" />
                <small *ngIf="hasError('fullName')" class="text-danger" style="font-size: 0.55rem;">{{ errors['fullName'] }}</small>
            </div>
        </div>

        <div style="display: flex; gap: 0.5rem;">
            <div style="flex: 1;">
                <label class="dialog-label">رقم الهوية <span class="text-danger">*</span></label>
                <input pInputText type="text" [class.ng-invalid]="hasError('nationalId')" [(ngModel)]="model.nationalId" placeholder="رقم الهوية الوطنية" />
                <small *ngIf="hasError('nationalId')" class="text-danger" style="font-size: 0.55rem;">{{ errors['nationalId'] }}</small>
            </div>
            <div style="flex: 1;">
                <label class="dialog-label">المسمى الوظيفي <span class="text-danger">*</span></label>
                <input pInputText type="text" [class.ng-invalid]="hasError('jobTitle')" [(ngModel)]="model.jobTitle" placeholder="المسمى الوظيفي" />
                <small *ngIf="hasError('jobTitle')" class="text-danger" style="font-size: 0.55rem;">{{ errors['jobTitle'] }}</small>
            </div>
        </div>

        <div style="display: flex; gap: 0.5rem;">
            <div style="flex: 1;">
                <label class="dialog-label">الفرع <span class="text-danger">*</span></label>
                <p-dropdown [options]="branches()" [(ngModel)]="model.branchId" optionLabel="name" optionValue="id"
                    placeholder="اختر الفرع" [class.ng-invalid]="hasError('branchId')" appendTo="body"></p-dropdown>
                <small *ngIf="hasError('branchId')" class="text-danger" style="font-size: 0.55rem;">{{ errors['branchId'] }}</small>
            </div>
            <div style="flex: 1;">
                <label class="dialog-label">القسم <span class="text-danger">*</span></label>
                <p-dropdown [options]="departments()" [(ngModel)]="model.departmentId" optionLabel="name" optionValue="id"
                    placeholder="اختر القسم" [class.ng-invalid]="hasError('departmentId')" appendTo="body"></p-dropdown>
                <small *ngIf="hasError('departmentId')" class="text-danger" style="font-size: 0.55rem;">{{ errors['departmentId'] }}</small>
            </div>
        </div>

        <div style="display: flex; gap: 0.5rem; align-items: flex-end;">
            <div style="flex: 1;">
                <label class="dialog-label">تاريخ التعيين <span class="text-danger">*</span></label>
                <p-calendar [(ngModel)]="model.hireDate" [showIcon]="true" dateFormat="dd/mm/yy"
                    placeholder="اختر التاريخ" [class.ng-invalid]="hasError('hireDate')" appendTo="body"></p-calendar>
                <small *ngIf="hasError('hireDate')" class="text-danger" style="font-size: 0.55rem;">{{ errors['hireDate'] }}</small>
            </div>
            <div style="flex: 1;">
                <label class="dialog-label">الراتب الأساسي <span class="text-danger">*</span></label>
                <p-inputNumber [(ngModel)]="model.basicSalary" [min]="0" [maxFractionDigits]="0"
                    placeholder="0" [class.ng-invalid]="hasError('basicSalary')"></p-inputNumber>
                <small *ngIf="hasError('basicSalary')" class="text-danger" style="font-size: 0.55rem;">{{ errors['basicSalary'] }}</small>
            </div>
        </div>

        <div style="display: flex; gap: 0.5rem; margin-top: 0.25rem;">
            <div style="flex: 1;">
                <label class="dialog-label">ربط بمستخدم نظام (اختياري)</label>
                <p-dropdown [options]="users()" [(ngModel)]="model.userId" optionLabel="username" optionValue="id"
                    placeholder="اختر مستخدم النظام" [showClear]="true" appendTo="body">
                    <ng-template let-user pTemplate="item">
                        <div class="flex align-items-center gap-2">
                            <i class="pi pi-user"></i>
                            <span>{{user.fullName}} ({{user.username}})</span>
                        </div>
                    </ng-template>
                </p-dropdown>
            </div>
        </div>

        <div style="display: flex; align-items: center; gap: 0.4rem; height: 1.8rem; margin-top: 0.25rem;">
            <p-inputSwitch [(ngModel)]="model.isActive"></p-inputSwitch>
            <label class="dialog-label" style="margin: 0;">نشط بالخدمة</label>
        </div>
    </div>

    <ng-template pTemplate="footer">
        <p-button label="إلغاء" icon="pi pi-times" [text]="true" (onClick)="cancel()"></p-button>
        <p-button [label]="editMode ? 'حفظ التعديلات' : 'إضافة موظف'" icon="pi pi-check" size="small"
            severity="primary" [loading]="saving()" (onClick)="save()"></p-button>
    </ng-template>
</p-dialog>
<p-toast position="top-left"></p-toast>
